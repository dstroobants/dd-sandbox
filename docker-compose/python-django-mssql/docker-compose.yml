name: django-gevent-ssi-repro

services:
  djangoapp:
    container_name: telco-manager
    build:
      context: ./sample_app
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      # ----- repro toggle -----
      # ssi  = ddtrace-run gunicorn ... (mimics K8s SSI ordering)
      # auto = gunicorn ... + ddtrace.auto in wsgi.py (ddtrace loaded after gevent monkey-patch)
      # off  = gunicorn ... with DD_TRACE_ENABLED=false (control)
      INSTRUMENT_MODE: ssi

      # ----- Django -----
      SETTINGS_PATH: telco_integration.settings_uat
      SECRET_KEY: insecure-dev-key-do-not-use-in-prod

      # ----- MSSQL connection (mssql-django + pyodbc) -----
      DB_HOST: mssql
      DB_PORT: "1433"
      DB_NAME: tempdb
      DB_USER: sa
      DB_PASSWORD: "YourStrong!Passw0rd"

      # ----- Datadog tracer config -----
      # Production K8s pod uses unix sockets (DD_TRACE_AGENT_URL=unix:///var/run/datadog/apm.socket).
      # TCP is used here for simplicity. Switch to UDS if/when needed.
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_DOGSTATSD_HOST: datadog-agent
      DD_DOGSTATSD_PORT: "8125"

      DD_SERVICE: ussd-telcomanager-deployment
      DD_ENV: uat-aks-clstr1
      DD_VERSION: repro-1
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_TRACE_HEALTH_METRICS_ENABLED: "true"
      DD_TRACE_DEBUG: "true"
      # Mirrors the production DatadogAgent CR which disables these features.
      DD_REMOTE_CONFIGURATION_ENABLED: "false"
      DD_DYNAMIC_INSTRUMENTATION_ENABLED: "false"
      DD_SYMBOL_DATABASE_UPLOAD_ENABLED: "false"
    labels:
      com.datadoghq.tags.env: uat-aks-clstr1
      com.datadoghq.tags.service: ussd-telcomanager-deployment
      com.datadoghq.tags.version: repro-1
    depends_on:
      mssql:
        condition: service_healthy
      datadog-agent:
        condition: service_started

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: telco-manager-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -No -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: telco-manager-datadog-agent
    pid: host
    ports:
      - "127.0.0.1:8126:8126/tcp"
      - "127.0.0.1:8125:8125/udp"
    env_file:
      - ~/sandbox.docker.env # contains DD_API_KEY
    environment:
      DD_SITE: datadoghq.eu
      DD_LOG_LEVEL: info
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_AC_EXCLUDE: "name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
